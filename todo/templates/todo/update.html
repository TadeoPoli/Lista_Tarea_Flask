{% extends 'base.html' %}

{% block header %}
<h1>{% block title %}Editar {{todo['description'] }} {% endblock %}</h1>
{% endblock %}

{% block content %}
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="description">Descripción:</label>
    <textarea name="description" id="description" maxlength="500" required>{{ request.form.get('description', todo['description']) }}</textarea>
    <label for="completed">Completado</label>
    <input type="checkbox" name="completed" id="completed" {% if todo['completed'] == 1 %} checked {% endif %}>
    <input type="submit" value="Guardar" />
</form>
<form action="{{ url_for('todo.delete', id=todo['id']) }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input class="danger" type="submit" value="Eliminar" onclick="return confirm('¿Estás seguro de que deseas eliminar este todo?');" />
</form>
{% endblock %}
