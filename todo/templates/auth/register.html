{% extends 'base.html' %}

{% block header %}
 <h1>{% block title %}Registro{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Usuario</label>
    <input name="username" id="username" value="{{ username }}" minlength="3" maxlength="50" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input type="password" name="password" id="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    <input type="submit" value="Registrarse">
  </form>
{% endblock %}
